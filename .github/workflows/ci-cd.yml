name: CI/CD – credit default model

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Train, test and gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Train model (seed 20)
        run: python train.py
      - name: Run tests and metric gate
        run: pytest -q
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: model/
          retention-days: 30

  deploy:
    name: Deploy to Hugging Face Space
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://huggingface.co/spaces/${{ vars.HF_SPACE_ID }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: model
          path: model/
      - name: Install deploy tooling
        run: pip install huggingface_hub==2.4.0 gradio_client
      - name: Upload to Space
        run: python scripts/deploy.py
      - name: Post-deployment smoke test
        run: python scripts/smoke_check.py
